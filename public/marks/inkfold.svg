<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Inkfold">
  <rect width="64" height="64" rx="15" fill="#D93A22"/>
  <!-- left leaf of the fold -->
  <path d="M14 15.5 L29.2 20.4 L29.2 48.5 L14 43.6 Z" fill="#FAF6EC"/>
  <!-- right leaf, folded back: darker to read as the reverse of the sheet -->
  <path d="M50 15.5 L34.8 20.4 L34.8 48.5 L50 43.6 Z" fill="#FAF6EC" opacity="0.62"/>
  <!-- the gutter: the gap between panels where the reader does the work -->
  <rect x="30.6" y="18.6" width="2.8" height="31.4" rx="1.4" fill="#FAF6EC"/>
</svg>
