<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Parlore">
  <defs>
    <linearGradient id="pl-brass" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0AC52"/>
      <stop offset="0.55" stop-color="#C08A2E"/>
      <stop offset="1" stop-color="#8E6320"/>
    </linearGradient>
    <linearGradient id="pl-overlap" x1="13" y1="13" x2="19" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4CE8C"/>
      <stop offset="1" stop-color="#D89B39"/>
    </linearGradient>
    <clipPath id="pl-discA"><circle cx="13" cy="19" r="6"/></clipPath>
  </defs>

  <!-- archway: the doorway of the room -->
  <path d="M4 29V16a12 12 0 0 1 24 0v13"
        stroke="url(#pl-brass)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- threshold bar -->
  <path d="M2.5 29h27" stroke="url(#pl-brass)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- two presences sharing the room -->
  <circle cx="13" cy="19" r="6" stroke="url(#pl-brass)" stroke-width="2.5"/>
  <circle cx="19" cy="19" r="6" stroke="url(#pl-brass)" stroke-width="2.5"/>

  <!-- the overlap: shared presence -->
  <g clip-path="url(#pl-discA)">
    <circle cx="19" cy="19" r="6" fill="url(#pl-overlap)" fill-opacity="0.9"/>
  </g>
</svg>
