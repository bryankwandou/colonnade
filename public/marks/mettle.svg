<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Mettle">
  <defs>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23282F"/>
      <stop offset="1" stop-color="#0C0E11"/>
    </linearGradient>
    <linearGradient id="steel" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F2F6FA"/>
      <stop offset="0.45" stop-color="#C3CEDA"/>
      <stop offset="1" stop-color="#7E8D9E"/>
    </linearGradient>
    <linearGradient id="molten" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC24A"/>
      <stop offset="1" stop-color="#FF5F1F"/>
    </linearGradient>
    <linearGradient id="strike" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <clipPath id="dieClip">
      <path d="M14 3h36a11 11 0 0 1 11 11v29a8 8 0 0 1-2.34 5.66l-8 8A8 8 0 0 1 45 59H14A11 11 0 0 1 3 48V14A11 11 0 0 1 14 3Z"/>
    </clipPath>
  </defs>

  <!-- assay die: rounded square with a chamfered lower-right corner, the way a struck hallmark reads -->
  <path d="M14 3h36a11 11 0 0 1 11 11v29a8 8 0 0 1-2.34 5.66l-8 8A8 8 0 0 1 45 59H14A11 11 0 0 1 3 48V14A11 11 0 0 1 14 3Z" fill="url(#die)"/>

  <!-- chamfer face catches the light -->
  <path d="M61 43v0a8 8 0 0 1-2.34 5.66l-8 8A8 8 0 0 1 45 59h-1l17-17Z" fill="url(#molten)" opacity="0.9"/>

  <!-- the struck M: a bevel ghost sits under the face so the letter reads as displaced metal -->
  <g clip-path="url(#dieClip)">
    <path d="M15 47V21l17 16 17-16v26" fill="none" stroke="#000000" stroke-opacity="0.55"
          stroke-width="7.5" stroke-linejoin="miter" stroke-linecap="butt" transform="translate(1.4,1.6)"/>
    <path d="M15 47V21l17 16 17-16v26" fill="none" stroke="url(#steel)"
          stroke-width="7.5" stroke-linejoin="miter" stroke-linecap="butt"/>
    <path d="M15 21l17 16 17-16" fill="none" stroke="#FFFFFF" stroke-opacity="0.5"
          stroke-width="1.4" stroke-linejoin="miter" transform="translate(0,-2.6)"/>
    <rect x="0" y="0" width="64" height="64" fill="url(#strike)"/>
  </g>

  <!-- rim -->
  <path d="M14 3h36a11 11 0 0 1 11 11v29a8 8 0 0 1-2.34 5.66l-8 8A8 8 0 0 1 45 59H14A11 11 0 0 1 3 48V14A11 11 0 0 1 14 3Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="1.25"/>
</svg>
