<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Keelstack">
  <title>Keelstack</title>
  <!-- Strakes: four hull planks, each narrower than the one above, split by the
       keel channel at centre. The taper reads as a hull cross-section from the
       bow and as a stack of layers at the same time. -->
  <g fill="#0C1E26">
    <rect x="4"    y="4"    width="10.4" height="4.2" rx="1.2"/>
    <rect x="17.6" y="4"    width="10.4" height="4.2" rx="1.2"/>
    <rect x="6.6"  y="9.6"  width="7.8"  height="4.2" rx="1.2"/>
    <rect x="17.6" y="9.6"  width="7.8"  height="4.2" rx="1.2"/>
    <rect x="9.2"  y="15.2" width="5.2"  height="4.2" rx="1.2"/>
    <rect x="17.6" y="15.2" width="5.2"  height="4.2" rx="1.2"/>
    <rect x="11.8" y="20.8" width="2.6"  height="4.2" rx="1.2"/>
    <rect x="17.6" y="20.8" width="2.6"  height="4.2" rx="1.2"/>
  </g>
  <!-- The keel: laid first, runs the full depth, extends past the last strake
       because everything else fastens to it. -->
  <rect x="14.4" y="4" width="3.2" height="25" rx="1.6" fill="#E4572E"/>
</svg>
