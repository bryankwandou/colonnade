<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="steleMarkTitle">
  <title id="steleMarkTitle">Stele</title>

  <defs>
    <!-- Batu kapur hangat. Gradiennya condong dari kiri-atas supaya slab terbaca
         punya ketebalan, bukan sekadar bidang datar. -->
    <linearGradient id="stone" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0"   stop-color="#F2ECDF"/>
      <stop offset="0.52" stop-color="#DFD3BC"/>
      <stop offset="1"   stop-color="#C2B49A"/>
    </linearGradient>

    <!-- Sisi kanan sedikit lebih gelap: satu sumber cahaya, konsisten. -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#4A3F2C" stop-opacity="0.20"/>
    </linearGradient>

    <clipPath id="slab">
      <path d="M20 61 V22 a12 12 0 0 1 24 0 V61 Z"/>
    </clipPath>
  </defs>

  <!-- Bayangan tipis di dasar; membuat slab berdiri, bukan melayang. -->
  <ellipse cx="32" cy="61.4" rx="17" ry="1.9" fill="#4A3F2C" opacity="0.16"/>

  <!-- Badan stele: persegi dengan puncak melengkung, bentuk yang muncul
       berulang di Mesir, Yunani, Tiongkok, dan pilar Ashoka. -->
  <path d="M20 61 V22 a12 12 0 0 1 24 0 V61 Z" fill="url(#stone)"/>
  <path d="M20 61 V22 a12 12 0 0 1 24 0 V61 Z" fill="url(#edge)"/>
  <path d="M20 61 V22 a12 12 0 0 1 24 0 V61 Z" fill="none" stroke="#8A7A5E" stroke-opacity="0.55" stroke-width="1.1"/>

  <g clip-path="url(#slab)">
    <!-- Guratan pahatan. Tiap baris digambar dua kali: garis gelap sebagai alur,
         garis terang setengah piksel di bawahnya sebagai tepi yang kena cahaya.
         Itu yang membuatnya terbaca terpahat, bukan sekadar digaris. -->
    <g stroke-linecap="round">
      <g stroke="#FFFFFF" stroke-opacity="0.55" transform="translate(0 1.05)">
        <line x1="26" y1="29" x2="38" y2="29" stroke-width="2.1"/>
        <line x1="26" y1="36" x2="38" y2="36" stroke-width="2.1"/>
        <line x1="26" y1="43" x2="38" y2="43" stroke-width="2.1"/>
        <line x1="26" y1="50" x2="33" y2="50" stroke-width="2.1"/>
      </g>
      <g stroke="#6B5C42" stroke-opacity="0.78">
        <line x1="26" y1="29" x2="38" y2="29" stroke-width="2.1"/>
        <line x1="26" y1="36" x2="38" y2="36" stroke-width="2.1"/>
        <line x1="26" y1="43" x2="38" y2="43" stroke-width="2.1"/>
      </g>
      <!-- Baris terakhir belum penuh dan berwarna: bacaan hari ini, yang masih
           berjalan. Satu detail kecil yang membuat lambang ini bercerita. -->
      <line x1="26" y1="50" x2="33" y2="50" stroke="#B5502A" stroke-width="2.1"/>
    </g>
  </g>
</svg>
